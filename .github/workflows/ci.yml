name: Build and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ qt6-base-dev portaudio19-dev libsndfile1-dev pkg-config python3
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 2
      - name: Test engine, GUI, and agent workflows
        run: ctest --test-dir build --output-on-failure
      - name: Verify installed agent entry point
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/ferro-install"
          env -u DISPLAY -u WAYLAND_DISPLAY "$RUNNER_TEMP/ferro-install/bin/ferro-agent" version
